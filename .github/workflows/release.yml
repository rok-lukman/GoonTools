name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Stage addon folder
        run: |
          mkdir -p "${RUNNER_TEMP}/GoonTools"
          rsync -a --exclude='.git*' --exclude='.github' --exclude='Ace3/tests' ./ "${RUNNER_TEMP}/GoonTools/"
          sed -i "s/^## Version:.*/## Version: ${GITHUB_REF_NAME#v}/" "${RUNNER_TEMP}/GoonTools/GoonTools.toc"

      - name: Create ZIP archive
        working-directory: ${{ runner.temp }}
        run: zip -r "GoonTools-${GITHUB_REF_NAME}.zip" GoonTools

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${RUNNER_TEMP}/GoonTools-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
